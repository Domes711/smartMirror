[pytest]
# backend/ is the import root: `features.*` and `shared.*` resolve the same
# way in tests as they do under systemd (PYTHONPATH=backend).
pythonpath = .
# Tests live in a `tests/` dir next to the code they cover (data/tests/,
# features/<name>/tests/, shared/tests/, tests/ for the gateway). Collecting
# from the root finds all of them — the old explicit `testpaths = features
# shared` silently skipped data/ and test_gateway.py.
testpaths = .
# features/*/tools/ holds hardware probe scripts (serial/GPIO/camera), some of
# which are named test_*.py. They are run by hand on the Pi, not collected.
norecursedirs = tools node_modules var .git __pycache__
