<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MMM-Spending · live demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100;200;300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./MMM-Spending.css">
    <style>
        html, body {
            background: #000; color: #fff;
            font-family: "Roboto Condensed", sans-serif;
            margin: 0; padding: 40px 50px;
        }
        .mm-region { text-align: right; }
        .module { display: inline-block; text-align: left; }
        .module-header {
            font-size: 15px; font-weight: 400;
            text-transform: uppercase; letter-spacing: 2px;
            border-bottom: 1px solid #666;
            padding-bottom: 6px; margin-bottom: 12px;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div class="mm-region">
        <div class="module">
            <div class="module-header" id="hdr">Útrata dnes</div>
            <div id="mount"></div>
        </div>
    </div>

    <script>
        // Stub MagicMirror framework so the module file can register itself.
        window.Log = console;
        window.Module = { _def: null, register: function (n, d) { this._def = d; } };
    </script>
    <script src="./MMM-Spending.js"></script>
    <script>
        const def = window.Module._def;
        const mountEl = document.getElementById("mount");

        const mod = Object.assign({}, def);
        mod.config = Object.assign({}, def.defaults, { language: "cs", currency: "CZK" });
        mod.data = null;
        mod.errorMsg = null;
        mod._currentDay = "demo";
        mod.updateDom = function () {
            const el = this.getDom();
            mountEl.innerHTML = "";
            mountEl.appendChild(el);
        };
        mod.sendSocketNotification = function () {};

        function feed(mod, s) {
            if (s.state === "loading") {
                mod.data = null;
                mod.errorMsg = null;
            } else if (s.state === "error") {
                mod.data = null;
                mod.errorMsg = s.errorMsg;
            } else {
                mod.data = s.data;
                mod.errorMsg = null;
            }
            mod.updateDom();
        }

        // DEMO_STATES: the contract the AI module builder's preview iframe
        // (Workshop's Preview tab) drives over postMessage (see HOST WIRING
        // below) — each state feeds mod with realistic sample data the way
        // node_helper would, then re-renders.
        window.DEMO_STATES = [
            { id: "real", label: "Dnešní útrata", apply: (mod) => feed(mod, {
                state: "data",
                data: {
                    total: 432.99, currency: "CZK", count: 2,
                    recent: [
                        { payee: "TOP TABAK",  amount: 173,    currency: "CZK" },
                        { payee: "ONTHATASS",  amount: 259.99, currency: "CZK" }
                    ],
                    generatedAt: new Date().toISOString()
                }
            }) },
            { id: "empty", label: "Žádné transakce", apply: (mod) => feed(mod, {
                state: "data",
                data: { total: 0, currency: "CZK", count: 0, recent: [], generatedAt: new Date().toISOString() }
            }) },
            { id: "heavy", label: "Hodně transakcí", apply: (mod) => feed(mod, {
                state: "data",
                data: {
                    total: 2841.50, currency: "CZK", count: 7,
                    recent: [
                        { payee: "Wolt",                   amount: 376, currency: "CZK" },
                        { payee: "Restaurant & Pub Pivni",  amount: 260, currency: "CZK" },
                        { payee: "2111495412/2700",         amount: 615, currency: "CZK" }
                    ],
                    generatedAt: new Date().toISOString()
                }
            }) },
            { id: "big", label: "Velká částka", apply: (mod) => feed(mod, {
                state: "data",
                data: {
                    total: 18450, currency: "CZK", count: 4,
                    recent: [
                        { payee: "Alza.cz",    amount: 12990, currency: "CZK" },
                        { payee: "Lidl Brno",  amount: 1240,  currency: "CZK" },
                        { payee: "Zabka Brno", amount: 89,    currency: "CZK" }
                    ],
                    generatedAt: new Date().toISOString()
                }
            }) },
            { id: "loading", label: "Načítání", apply: (mod) => feed(mod, { state: "loading" }) },
            { id: "error", label: "Chyba API", apply: (mod) => feed(mod, { state: "error", errorMsg: "API token expired (HTTP 401)" }) }
        ];

        function applyState(id) {
            const s = window.DEMO_STATES.find((x) => x.id === id) || window.DEMO_STATES[0];
            s.apply(mod);
        }
        function applyFromHash() {
            applyState((location.hash || "#real").slice(1));
        }
        window.addEventListener("hashchange", applyFromHash);

        // HOST WIRING — the app embeds demo.html in an <iframe> and talks to
        // it over postMessage; this block is verbatim across every module.
        window.addEventListener("message", (ev) => {
            const msg = ev.data || {};
            if (msg.type === "set-state" && msg.id) applyState(msg.id);
        });
        if (window.parent !== window) {
            window.parent.postMessage({ type: "states", states: window.DEMO_STATES.map(({ id, label }) => ({ id, label })) }, "*");
        }

        applyFromHash();
    </script>
</body>
</html>
